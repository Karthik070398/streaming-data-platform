version: "3.8"

# This file describes every "mini-computer" (container) our platform needs.
# Run `docker compose up -d` in this folder and Docker builds and starts ALL of them at once.

services:

  # Zookeeper coordinates Kafka brokers. Older Kafka versions require it.
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # Kafka is our message broker - the "postal service" that moves events around.
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"   # this is the port your Python code will connect to
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners: one for other containers (kafka-ui, schema-registry)
      # to use internally, one for your Mac (running Python directly) to use.
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  # Schema Registry stores and enforces the "shape" of our messages (used in Layer 2).
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.0
    container_name: schema-registry
    depends_on:
      - kafka
    ports:
      - "8081:8081"
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081

  # Postgres simulates our "production database" that Layer 1 will read from.
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform_pw
      POSTGRES_DB: rides_db

  # Kafka UI - a free web dashboard so you can SEE your topics and messages visually.
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"   # open http://localhost:8080 in your browser once running
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081

 # ============================================================
  # OBSERVABILITY STACK -- add these three services below your
  # existing services in docker-compose.yml (same indentation level
  # as "kafka:", "postgres:", etc. -- under the top-level "services:" key)
  # ============================================================

  # Reads Kafka's internal state (consumer lag, topic sizes, partition
  # counts) and exposes it in a format Prometheus understands.
  kafka-exporter:
    image: danielqsj/kafka-exporter:latest
    container_name: kafka-exporter
    depends_on:
      - kafka
    command: ["--kafka.server=kafka:29092"]
    ports:
      - "9308:9308"

  # Prometheus periodically pulls ("scrapes") metrics from kafka-exporter
  # and stores them over time, so we can see trends, not just snapshots.
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    depends_on:
      - kafka-exporter
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"   # Prometheus's own web UI, useful for sanity checks

  # Grafana turns Prometheus's stored metrics into actual dashboards --
  # graphs, gauges, alerts -- that a human can look at.
  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"   # open http://localhost:3000 once running
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin   # login: admin / admin
