# Prometheus's job is to periodically "scrape" (pull) metrics from other
# services and store them over time. This file tells it WHERE to scrape
# and HOW OFTEN.

global:
  scrape_interval: 5s   # ask every target for fresh numbers every 5 seconds

scrape_configs:
  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']   # kafka-exporter's metrics endpoint
